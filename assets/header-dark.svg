<svg width="854" height="160" viewBox="0 0 854 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.04); }
    }
    .name-shimmer {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: url(#shimmer-dark);
      text-anchor: middle;
      animation: fadeIn 0.8s ease-out forwards;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: 0.3px;
      fill: #94A3B8;
      text-anchor: middle;
      animation: fadeIn 1s ease-out forwards;
    }
    .card-glass {
      animation: fadeIn 0.6s ease-out forwards;
    }
    .ambient-glow {
      animation: pulseAura 6s ease-in-out infinite;
      transform-origin: 427px 80px;
    }
  </style>

  <defs>
    <!-- Shimmer Sweep on Text -->
    <linearGradient id="shimmer-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" from="-150%" to="250%" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-50%" to="350%" dur="4.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <!-- Glow Gradient -->
    <linearGradient id="glow-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glassmorphism Card Border -->
    <linearGradient id="glass-border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glassmorphism Card Surface Fill -->
    <linearGradient id="glass-surface-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Glass Card -->
  <g filter="url(#ambient-blur)" class="ambient-glow">
    <ellipse cx="427" cy="80" rx="180" ry="38" fill="url(#glow-grad-dark)" />
  </g>

  <!-- Glassmorphic Card Container -->
  <g class="card-glass">
    <rect x="77" y="15" width="700" height="130" rx="20" fill="url(#glass-surface-dark)" stroke="url(#glass-border-dark)" stroke-width="1.2" />
  </g>

  <!-- Content -->
  <text x="50%" y="72" class="name-shimmer">Muhammad Ali</text>
  <text x="50%" y="112" class="subtitle">
    Full-Stack Software Engineer
    <tspan fill="#38BDF8" font-weight="700"> • </tspan>
    AI Systems Developer
  </text>
</svg>