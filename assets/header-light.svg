<svg width="854" height="180" viewBox="0 0 854 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-15px, 5px) scale(1.08); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(20px, -6px) scale(1.1); }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 54px;
      font-weight: 800;
      fill: #0F172A;
      text-anchor: middle;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      fill: #0284C7;
      text-anchor: middle;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      letter-spacing: 0.3px;
    }
    .orb1 {
      animation: float1 8s ease-in-out infinite;
      transform-origin: center;
    }
    .orb2 {
      animation: float2 10s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <defs>
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
      </feMerge>
    </filter>
    <linearGradient id="grad-light-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="grad-light-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g filter="url(#glow-light)">
    <ellipse class="orb1" cx="410" cy="85" rx="150" ry="50" fill="url(#grad-light-1)" />
    <ellipse class="orb2" cx="450" cy="90" rx="140" ry="45" fill="url(#grad-light-2)" />
  </g>

  <text class="title" x="50%" y="82">Muhammad Ali</text>
  <text class="subtitle" x="50%" y="128">Full-Stack Software Engineer | AI Systems Developer</text>
</svg>